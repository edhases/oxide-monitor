[package]
name = "oxide-settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oxide-settings"
path = "src/main.rs"

[dependencies]
oxide-core.workspace = true
oxide-ipc.workspace = true
oxide-render.workspace = true
eframe = { version = "0.37.0", default-features = false, features = [
    "wgpu_no_default_features",
    "clipboard",
    "default_fonts",
] }
egui = { version = "0.37.0", default-features = false }
wgpu = { version = "30.0", default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
    "wgsl",
] }
fluent-bundle.workspace = true
unic-langid.workspace = true
raw-window-handle = "0.6"
tracing.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"
